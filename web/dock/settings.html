<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'">
  <title>塘里 Dock 设置</title>
  <link rel="stylesheet" href="dock.css">
</head>
<body class="settings-page">
  <main class="settings">
    <header class="settings-title">
      <h1>塘里 Dock</h1>
      <label class="switch"><input type="checkbox" id="enabled"><span>启用 Dock</span></label>
    </header>
    <section class="pane" aria-labelledby="appearance-title">
      <h2 id="appearance-title">外观</h2>
      <div class="material-grid" aria-label="底板材质">
        <button type="button" data-material="frosted" aria-pressed="false"><span class="sample"><i></i><i></i><i></i></span>磨砂玻璃</button>
        <button type="button" data-material="transparent" aria-pressed="false"><span class="sample"><i></i><i></i><i></i></span>纯透明</button>
        <button type="button" data-material="solid" aria-pressed="false"><span class="sample"><i></i><i></i><i></i></span>深色实底</button>
      </div>
      <div class="setting-columns">
        <label>形态<select id="layout"><option value="floating">居中悬浮</option><option value="full">贴边全宽</option></select></label>
        <label>停靠边缘<select id="edge"><option value="bottom">底部</option><option value="left">左侧</option><option value="right">右侧</option></select></label>
        <label>显示器<select id="displayId"></select></label>
        <label>图标大小 <output id="size-readout"></output><input type="range" id="iconSize" min="28" max="56"></label>
        <label>底板不透明度 <output id="opacity-readout"></output><input type="range" id="opacity" min="35" max="100"></label>
      </div>
      <div class="options">
        <label><input type="checkbox" id="magnify"> 悬停放大</label>
        <label><input type="checkbox" id="autohide"> 自动隐藏</label>
        <label><input type="checkbox" id="followPond"> 跟随池塘时段</label>
      </div>
    </section>
    <section class="pane" aria-labelledby="pins-title">
      <h2 id="pins-title">固定到 Dock</h2>
      <div class="actions"><button type="button" data-pick="file">添加应用或文件</button><button type="button" data-pick="folder">添加文件夹</button></div>
    </section>
    <section class="pane" aria-labelledby="search-title">
      <h2 id="search-title">搜索范围</h2>
      <p id="shortcut"></p>
      <p>选择要在本机建立文件名和路径索引的盘符。首次扫描在后台进行。</p>
      <div id="drives" class="options">正在读取盘符…</div>
      <button id="save-index" type="button">应用搜索范围</button>
    </section>
    <section class="pane" aria-labelledby="takeover-title">
      <h2 id="takeover-title">Windows 任务栏</h2>
      <p id="takeover-status"></p>
      <button id="takeover" type="button">接管任务栏</button>
    </section>
    <p id="settings-status" class="notice" role="status" hidden></p>
  </main>
  <script src="settings.js"></script>
</body>
</html>

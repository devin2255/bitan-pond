name: Installer download chart

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: installer-download-chart
  cancel-in-progress: false

jobs:
  update:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read installer counts and redraw the chart
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" | node tools/update-download-chart.cjs
      - name: Save the download history and chart
        run: |
          git add -- docs/downloads/history.json docs/downloads/chart.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: update installer download chart'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF"

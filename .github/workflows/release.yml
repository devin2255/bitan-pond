name: Publish Tangli

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, for example v1.1.3'
        required: true
        type: string
      diagnoseShortcut:
        description: 'Run the isolated Windows shortcut diagnostic only'
        required: false
        type: boolean
        default: false

concurrency:
  group: tangli-production-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Diagnose shortcut on Windows runner
        if: ${{ inputs.diagnoseShortcut }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm ci
          $file = 'test/installer.test.cjs'
          $test = [IO.File]::ReadAllText($file)
          $test = $test.Replace('    const ps = path.join(', '    const queryLink = path.join(root, "shortcut-check.lnk"); fs.copyFileSync(link, queryLink);' + "`n" + '    const ps = path.join(')
          $test = $test.Replace('TANGLI_TEST_LINK: link', 'TANGLI_TEST_LINK: queryLink')
          $test = $test.Replace('query.stdout.trim().toLowerCase(), path.join(install, "塘里.exe").toLowerCase()', 'fs.realpathSync.native(query.stdout.trim()).toLowerCase(), fs.realpathSync.native(path.join(install, "塘里.exe")).toLowerCase()')
          $before = '    assert.equal(query.status, 0, query.stderr);'
          $after = '    console.log("SHORTCUT_DIAGNOSTIC", JSON.stringify({link, queryLink, status:query.status, stdout:query.stdout, stderr:query.stderr}));' + "`n" + $before
          if (-not $test.Contains($before)) { throw 'Diagnostic injection point missing' }
          [IO.File]::WriteAllText($file, $test.Replace($before, $after), [Text.UTF8Encoding]::new($false))
          node --test $file
          exit 1
      - name: Check version and install dependencies
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:RELEASE_TAG -notmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') { throw 'Invalid release tag' }
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag and package version do not match' }
          "TANGLI_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          npm ci
          npm run check:updates
          npm test
      - name: Build release
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $dir = "dist/release-v$env:TANGLI_VERSION"
          $exe = "$dir/Tangli-v$env:TANGLI_VERSION-Windows-x64.exe"
          $setup = "$dir/Tangli-v$env:TANGLI_VERSION-Setup.exe"
          $notes = "docs/releases/v$env:TANGLI_VERSION.md"
          if (-not (Test-Path -LiteralPath $notes)) { throw "Missing release notes: $notes" }
          npm run dist -- "--config.directories.output=$dir"
          Copy-Item -LiteralPath "$dir/塘里.exe" -Destination $exe
          "TANGLI_RELEASE_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TANGLI_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TANGLI_SETUP=$setup" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TANGLI_RELEASE_NOTES=$notes" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Recover any existing release executable
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          node tools/recover-update-build.cjs $env:TANGLI_EXE $env:TANGLI_VERSION
      - name: Build and verify Windows installer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          node tools/build-setup.cjs $env:TANGLI_EXE $env:TANGLI_SETUP $env:TANGLI_VERSION
          node tools/recover-update-build.cjs $env:TANGLI_EXE $env:TANGLI_VERSION $env:TANGLI_SETUP
          node tools/verify-setup.cjs $env:TANGLI_SETUP $env:TANGLI_EXE
      - name: Sign and verify release assets
        env:
          TANGLI_SIGNING_KEY: ${{ secrets.TANGLI_UPDATE_SIGNING_KEY }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ([string]::IsNullOrWhiteSpace($env:TANGLI_SIGNING_KEY)) { throw 'Missing TANGLI_UPDATE_SIGNING_KEY Actions secret' }
          $key = Join-Path $env:RUNNER_TEMP 'tangli-update-ed25519.pem'
          [IO.File]::WriteAllText($key, $env:TANGLI_SIGNING_KEY, [Text.UTF8Encoding]::new($false))
          $env:TANGLI_SIGNING_KEY = $null
          node tools/prepare-domestic-update.cjs build $env:TANGLI_EXE $env:TANGLI_VERSION "$env:TANGLI_RELEASE_DIR/domestic" $key $env:TANGLI_RELEASE_NOTES 'update-channel.json' $env:TANGLI_SETUP
          node tools/verify-update-release.cjs $env:TANGLI_EXE "$env:TANGLI_RELEASE_DIR/domestic" $env:TANGLI_VERSION "$env:TANGLI_RELEASE_DIR/win-unpacked/resources/app.asar" $env:TANGLI_SETUP
      - name: Publish verified assets and compatibility feed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          node tools/publish-update-release.cjs $env:TANGLI_EXE "$env:TANGLI_RELEASE_DIR/domestic" "$env:TANGLI_RELEASE_DIR/win-unpacked/resources/app.asar" $env:TANGLI_VERSION $env:TANGLI_RELEASE_NOTES $env:TANGLI_SETUP
